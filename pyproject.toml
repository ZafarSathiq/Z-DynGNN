[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sandcert"
version = "0.1.0"
description = "Certified Structural Confidence for NDM-1 Mutation Effect Prediction"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SANDCERT Research Team" }
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "biopython>=1.83",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
